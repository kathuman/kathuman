<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 664 354" width="664" height="354" role="img" aria-label="Positioning matrix: rigour versus explorability, portfolio in the top-right quadrant"><title>Positioning matrix: rigour versus explorability, portfolio in the top-right quadrant</title><style>text{fill:#13202c;font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.t-m{fill:#587a96}.t-a{fill:#0b6aa2}.t-on{fill:#ffffff}.t-w{fill:#c96a1b}.t-b{fill:#bf3f2b}
.t-s{font-size:10.5px}.t-l{font-family:"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;font-weight:600}.t-xl{font-family:"Segoe UI",Helvetica,Arial,sans-serif;font-size:16px;font-weight:700}
.f-acc{fill:#0b6aa2}.f-ink{fill:#0a2f52}.f-line{fill:#c3d7e8}.f-surf{fill:#ffffff}.f-bad{fill:#bf3f2b}.f-warn{fill:#c96a1b}.f-none{fill:none}.f-muted{fill:#587a96}
.s-acc{stroke:#0b6aa2}.s-fg{stroke:#13202c}.s-m{stroke:#587a96}.s-bad{stroke:#bf3f2b}.s-line{stroke:#c3d7e8}.s-warn{stroke:#c96a1b}.s-ink{stroke:#0a2f52}</style><rect x="-12" y="-12" width="664" height="354" rx="10" fill="#ffffff" stroke="#c3d7e8"/>
    <rect x="330" y="20" width="290" height="135" class="f-acc" fill-opacity=".12"/>
    <line x1="40" y1="155" x2="620" y2="155" class="s-line"/><line x1="330" y1="20" x2="330" y2="290" class="s-line"/>
    <line x1="40" y1="290" x2="620" y2="290" class="s-m"/><line x1="40" y1="20" x2="40" y2="290" class="s-m"/>
    <text x="620" y="310" text-anchor="end" class="t-s t-m">easier to explore →</text>
    <text x="26" y="155" transform="rotate(-90 26 155)" text-anchor="middle" class="t-s t-m">validated rigour →</text>
    <text x="54" y="44" class="t-l">Academic models</text><text x="54" y="62" class="t-s t-m">rigorous, locked in code</text><text x="54" y="76" class="t-s t-m">and journals</text>
    <text x="54" y="180" class="t-l">Spreadsheets</text><text x="54" y="198" class="t-s t-m">fast, fragile, unverified</text>
    <text x="344" y="180" class="t-l">BI dashboards, decks</text><text x="344" y="198" class="t-s t-m">easy to read, explain nothing</text>
    <text x="344" y="44" class="t-l t-a">Validated decision labs</text><text x="344" y="62" class="t-s t-m">this portfolio</text>
    <g class="t-s">
      <circle cx="520" cy="58" r="6" class="f-acc"/><text x="530" y="62">Tierwise</text>
      <circle cx="430" cy="92" r="6" class="f-acc"/><text x="440" y="96">Stress Test</text>
      <circle cx="560" cy="110" r="6" class="f-acc"/><text x="525" y="132">Supply Pulse</text>
      <circle cx="380" cy="128" r="6" class="f-acc" fill-opacity=".5"/><text x="390" y="140" class="t-m">Atlas</text>
    </g>
    <path d="M150,100 C230,80 280,70 335,72" class="f-none s-m" stroke-dasharray="3 4"/>
    <path d="M440,230 C440,190 420,170 420,150" class="f-none s-m" stroke-dasharray="3 4"/>
    <text x="150" y="118" class="t-s t-m">add usability</text><text x="448" y="240" class="t-s t-m">add validation</text>
  </svg>