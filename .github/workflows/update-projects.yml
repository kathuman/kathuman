name: Update projects table

# Keeps the "Selected projects" table in README.md in step with the projects site's projects.json.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update-projects.mjs"
      - ".github/workflows/update-projects.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-projects.mjs
      - name: Commit if the table changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Update projects table from projects.json"
            git push
          fi
