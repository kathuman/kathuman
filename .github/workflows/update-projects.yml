name: Update gallery

# Keeps the two-discipline gallery in README.md (between the GALLERY markers) in step with the projects site's
# projects.json: featured tools per discipline, the newest others, and the counts. Daily and on demand.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-projects.mjs
      - name: Commit if the gallery changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Update gallery from projects.json"
            git push
          fi
