<!doctype html>
<!--
  banner.html — the profile banner in the Cobot Lab "blueprint" theme. Rendered to assets/banner-dark.png and
  assets/banner-light.png by scripts/render-banner.mjs (headless Chromium, real fonts, 2x). Open ?light for
  the light version.
-->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg1: #0d3a63; --bg2: #0a2f52; --grid: rgba(125,211,252,.08); --grid2: rgba(125,211,252,.16); --ink: #bfe4ff; --ink2: #8fd0f2; --faint: #6fa8c9; --accent: #7dd3fc; --line: #2a5580; --node: #0d3a63; }
  :root.light { --bg1: #ffffff; --bg2: #e9f1f8; --grid: rgba(11,106,162,.08); --grid2: rgba(11,106,162,.16); --ink: #0a2f52; --ink2: #2d5677; --faint: #587a96; --accent: #0b6aa2; --line: #c3d7e8; --node: #ffffff; }
  html, body { margin: 0; }
  .banner { position: relative; width: 1280px; height: 300px; overflow: hidden; box-sizing: border-box; border: 1px solid var(--line); border-radius: 14px;
    background:
      linear-gradient(var(--grid2) 1px, transparent 1px) 0 0 / 160px 160px,
      linear-gradient(90deg, var(--grid2) 1px, transparent 1px) 0 0 / 160px 160px,
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 32px 32px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 32px 32px,
      linear-gradient(180deg, var(--bg1), var(--bg2)); }
  /* corner brackets, as on Cobot Lab's panels */
  .tick { position: absolute; width: 22px; height: 22px; border-color: var(--accent); border-style: solid; border-width: 0; }
  .tick.tl { left: 18px; top: 18px; border-left-width: 2px; border-top-width: 2px; }
  .tick.tr { right: 18px; top: 18px; border-right-width: 2px; border-top-width: 2px; }
  .tick.bl { left: 18px; bottom: 18px; border-left-width: 2px; border-bottom-width: 2px; }
  .tick.br { right: 18px; bottom: 18px; border-right-width: 2px; border-bottom-width: 2px; }
  .text { position: absolute; left: 64px; top: 46px; width: 780px; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 15px; letter-spacing: .14em; color: var(--faint); text-transform: uppercase; }
  h1 { margin: 10px 0 0; font-family: "Rajdhani", sans-serif; font-weight: 700; font-size: 56px; line-height: 1; white-space: nowrap; letter-spacing: .03em; color: var(--ink); text-transform: uppercase; }
  h1 span { color: var(--accent); }
  h1 em { font-style: normal; text-transform: none; color: var(--ink); }
  .tag { margin-top: 12px; font-family: "Barlow", sans-serif; font-size: 21px; font-weight: 500; line-height: 1.35; color: var(--ink2); }
  .chips { margin-top: 20px; display: flex; gap: 8px; flex-wrap: nowrap; }
  .chips b { font-family: "Rajdhani", sans-serif; font-weight: 600; font-size: 13.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 4px 9px; background: color-mix(in srgb, var(--bg2) 70%, transparent); }
</style>
</head>
<body>
<div class="banner">
  <div class="tick tl"></div><div class="tick tr"></div><div class="tick bl"></div><div class="tick br"></div>
  <div class="text">
    <div class="kicker">Copenhagen</div>
    <h1>Daniel <span>Sepulveda Estay</span><em>, PhD</em></h1>
    <div class="tag">Supply chain resilience and network design: system dynamics, optimisation and simulation, built into tools people can use.</div>
    <div class="chips"><b>Systems analysis</b><b>Network design</b><b>Real options</b><b>Digital twins</b><b>Engineering simulation</b></div>
  </div>
</div>
<script>if (location.search.indexOf("light") >= 0) document.documentElement.className = "light";</script>
</body>
</html>
